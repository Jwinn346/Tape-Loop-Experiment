<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Recorder with Tape Hiss & Compression</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.32/Tone.min.js"></script>
    <style>
        body {
            text-align: center;
            font-family: "Courier New", monospace;
            background: #222;
            color: #fff;
            padding: 20px;
        }
        .container {
            background: #333;
            border-radius: 10px;
            padding: 20px;
            width: 500px;
            margin: auto;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.6);
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            width: 80%;
            margin: 5px;
        }
        label {
            font-size: 16px;
            margin-top: 5px;
        }
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <button id="record-btn">🎤 Start Recording</button>
            <button id="stop-record-btn" disabled>⏹ Stop Recording</button>
            <button id="play-btn" disabled>▶ Play Loop</button>
            <button id="stop-play-btn" disabled>⏹ Stop Playback</button>

            <h3>Playback Speed</h3>
            <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1">

            <h3>BPM Sync</h3>
            <input type="number" id="bpm-input" value="120" min="30" max="300">

            <h3>Effects</h3>
            <label>Echo (Tape Delay)</label>
            <input type="range" id="echo-slider" min="0" max="1" step="0.1" value="0">
            
            <label>Saturation</label>
            <input type="range" id="saturation-slider" min="0" max="1" step="0.1" value="0">
            
            <label>Wow & Flutter</label>
            <input type="range" id="flutter-slider" min="0" max="1" step="0.1" value="0">
            
            <label>Reverb</label>
            <input type="range" id="reverb-slider" min="0" max="1" step="0.1" value="0">
            
            <label>Filter (High Cut)</label>
            <input type="range" id="filter-slider" min="500" max="5000" step="100" value="3000">

            <h3>Tape Hiss</h3>
            <input type="range" id="hiss-slider" min="0" max="1" step="0.1" value="0">

            <h3>Compression</h3>
            <input type="range" id="compression-slider" min="0" max="1" step="0.1" value="0.5">

            <h3>Playback Volume</h3>
            <input type="range" id="volume-slider" min="-20" max="5" step="1" value="0">
        </div>
    </div>

    <script>
        let recorder, mic, micGain, player, recordedBuffer;
        let isRecording = false;
        let isPlaying = false;
        let bpm = 120;

        // Effects
        let echo = new Tone.FeedbackDelay("8n", 0.4);
        let saturation = new Tone.Distortion(0);
        let flutter = new Tone.Vibrato(6, 0.3);
        let reverb = new Tone.Reverb({ decay: 3, wet: 0 });
        let filter = new Tone.Filter(3000, "lowpass");
        let volume = new Tone.Volume(0);
        let compressor = new Tone.Compressor(-30, 3); // Compression to smooth out dynamics

        // Tape Hiss (Generated White Noise)
        let hiss = new Tone.Noise("white").start();
        let hissGain = new Tone.Gain(0).toDestination(); // Controls hiss volume
        hiss.connect(hissGain);

        async function setupAudio() {
            await Tone.start();
            mic = new Tone.UserMedia();
            await mic.open();

            micGain = new Tone.Gain(1).toDestination();
            mic.connect(micGain);

            recorder = new Tone.Recorder();
            mic.connect(recorder);
        }

        document.getElementById("record-btn").addEventListener("click", async () => {
            if (isRecording) return;
            await setupAudio();
            recorder.start();
            isRecording = true;
            updateButtons("recording");
        });

        document.getElementById("stop-record-btn").addEventListener("click", async () => {
            if (!isRecording) return;
            recordedBuffer = await recorder.stop();
            mic.disconnect();
            micGain.disconnect();

            player = new Tone.Player(URL.createObjectURL(recordedBuffer));
            player.loop = true;
            player.sync().start(0);
            applyEffects();

            player.chain(volume, compressor, Tone.Destination);

            player.playbackRate = document.getElementById("speed-slider").value;
            Tone.Transport.bpm.value = bpm;

            isRecording = false;
            updateButtons("stoppedRecording");
        });

        document.getElementById("play-btn").addEventListener("click", () => {
            if (player && !isPlaying) {
                Tone.Transport.start();
                isPlaying = true;
                updateButtons("playing");
            }
        });

        document.getElementById("stop-play-btn").addEventListener("click", () => {
            if (player && isPlaying) {
                Tone.Transport.stop();
                isPlaying = false;
                updateButtons("stoppedPlayback");
            }
        });

        // Effect Controls
        function applyEffects() {
            player.disconnect();
            player.chain(echo, saturation, flutter, reverb, filter, volume, compressor, Tone.Destination);
        }

        document.getElementById("echo-slider").addEventListener("input", (event) => {
            echo.wet.value = event.target.value;
            applyEffects();
        });

        document.getElementById("saturation-slider").addEventListener("input", (event) => {
            saturation.distortion = event.target.value;
            applyEffects();
        });

        document.getElementById("flutter-slider").addEventListener("input", (event) => {
            flutter.depth = event.target.value;
            applyEffects();
        });

        document.getElementById("reverb-slider").addEventListener("input", (event) => {
            reverb.wet.value = event.target.value;
            applyEffects();
        });

        document.getElementById("filter-slider").addEventListener("input", (event) => {
            filter.frequency.value = event.target.value;
            applyEffects();
        });

        document.getElementById("hiss-slider").addEventListener("input", (event) => {
            hissGain.gain.value = event.target.value;
        });

        document.getElementById("compression-slider").addEventListener("input", (event) => {
            compressor.ratio.value = 1 + event.target.value * 10; // Adjust compression intensity
        });

        document.getElementById("volume-slider").addEventListener("input", (event) => {
            volume.volume.value = event.target.value;
        });

        document.getElementById("speed-slider").addEventListener("input", (event) => {
            if (player) {
                player.playbackRate = event.target.value;
            }
        });

        document.getElementById("bpm-input").addEventListener("input", (event) => {
            bpm = event.target.value;
            Tone.Transport.bpm.value = bpm;
        });

        function updateButtons(state) {
            document.getElementById("record-btn").disabled = state === "recording";
            document.getElementById("stop-record-btn").disabled = state !== "recording";
            document.getElementById("play-btn").disabled = state !== "stoppedRecording";
            document.getElementById("stop-play-btn").disabled = state !== "playing";
        }
    </script>

</body>
</html>
